name: Publish NuGet Package

# Publishes MoreFortniteReplayDecompression to nuget.org when a version tag is pushed, for example:
#   git tag v1.0.0
#   git push origin v1.0.0
# The package version is taken from the tag (v1.0.0 -> 1.0.0).
#
# Uses NuGet trusted publishing, so no API key is stored in this repository.
# Setup (once):
#   1. On nuget.org: account menu -> Trusted Publishing -> add a policy for
#      this repository owner, repository "MoreFortniteReplayDecompression" and workflow file "publish.yml".
#   2. On GitHub: Settings -> Secrets and variables -> Actions -> add the secret NUGET_USER
#      with your nuget.org user name (not your email).

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  id-token: write # needed to get the OIDC token for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.x

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: dotnet build --configuration Release -p:Version=${{ steps.version.outputs.version }}
      - run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack ./src/FullExport/MoreFortniteReplayDecompression.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} --output ./artifacts/nuget

      - name: NuGet login (gets a short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish
        run: dotnet nuget push ./artifacts/nuget/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
